<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mineaglercraft Web Edition" />
  <title>Mineaglercraft | Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{--green:#08a957;--text:#f5f7fa;--side:215px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#101419}body{overflow-x:hidden}
    .app{min-height:100vh;display:flex;background:linear-gradient(90deg,rgba(10,12,15,.96) 0 var(--side),transparent var(--side)),linear-gradient(180deg,rgba(22,29,37,.2),rgba(7,11,14,.72)),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=85') center/cover fixed}
    aside{width:var(--side);flex:none;padding:14px 0 8px;background:rgba(24,24,24,.96);display:flex;flex-direction:column;z-index:2}.discord{display:flex;align-items:center;gap:13px;padding:6px 20px 23px;color:#fff;font-size:12px}.discord-mark{width:36px;height:27px;background:#fff;border-radius:10px 10px 13px 13px;position:relative;clip-path:polygon(0 0,100% 0,100% 78%,78% 78%,68% 100%,56% 78%,0 78%)}.discord-mark:after{content:'•  •';position:absolute;left:9px;top:6px;color:#292929;font-size:15px;letter-spacing:3px}.side-nav{display:grid;gap:0;margin-top:0}.side-nav a{min-height:68px;display:flex;align-items:center;gap:14px;padding:9px 18px 9px 20px;border-left:4px solid transparent;text-decoration:none;color:#fff;font-size:11px;line-height:1.25}.side-nav a:hover{background:#ffffff08}.side-nav a.active{background:#ffffff06;border-left-color:var(--green)}.block{width:30px;height:30px;display:block;flex:none;border-radius:3px;position:relative;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #0004,0 2px 3px #0008}.block:before,.block:after{content:'';position:absolute}.side-nav a:nth-child(1) .block{background:linear-gradient(135deg,#72df68 0 42%,#55b94b 43% 64%,#784a29 65%)}.side-nav a:nth-child(1) .block:before{inset:0;background:linear-gradient(150deg,transparent 42%,#4b9d43 43% 53%,transparent 54%),linear-gradient(30deg,transparent 48%,#9b6031 49% 75%,transparent 76%)}.side-nav a:nth-child(2) .block{background:linear-gradient(135deg,#949494,#585858 55%,#3f3f3f)}.side-nav a:nth-child(3) .block{background:linear-gradient(135deg,#e34735 0 48%,#b62b25 49% 100%)}.side-nav a:nth-child(4) .block{background:linear-gradient(135deg,#d69a4d 0 38%,#76502d 39% 62%,#bb7134 63%)}.side-nav span span{display:block;color:#fff;font-size:11px;margin-top:3px;text-transform:none}.bottom{margin-top:auto;border-top:0;padding:0 12px 0 20px;display:grid;gap:20px}.bottom a{display:flex;align-items:center;gap:18px;text-decoration:none;color:#fff;font-size:11px;padding:8px 0}.bottom a:first-child:before{content:'▤';font-size:27px;color:#f5eee3}.bottom a:nth-child(2):before{content:'⚙';font-size:25px;color:#eee}.version{font-size:11px;color:#a6a6a6;padding:0 0 0 0;margin-top:0}.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}.topbar{height:66px;display:flex;align-items:center;justify-content:center;gap:45px;padding:0 28px;background:#1013169c}.site-title{position:absolute;left:28px;font-size:13px;font-weight:900;letter-spacing:.04em}.topbar nav{display:flex;gap:28px}.topbar nav a{color:#cbd0d6;text-decoration:none;font-size:12px}.topbar nav a:first-child,.topbar nav a:hover{color:#fff;font-weight:700}.hero{flex:1;min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;position:relative}.logo{text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(25px,5vw,66px);line-height:1.15;letter-spacing:-.08em;color:#e7ebed;text-shadow:-5px 5px #64707c,-9px 9px #111,0 14px 18px #0009;transform:skew(-4deg);margin-top:-100px}.logo small{display:block;margin-top:15px;font-size:clamp(10px,1.4vw,19px);letter-spacing:.15em;text-shadow:2px 2px #222}.controls{position:absolute;left:28px;right:28px;bottom:28px;display:flex;align-items:center;gap:40px}.select{height:60px;min-width:280px;max-width:360px;flex:1;display:flex;align-items:center;gap:12px;padding:0 18px;border:1px solid #ffffff2b;border-radius:10px;background:#101316b8;box-shadow:0 8px 20px #0005}.cube{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,#b9edaa,#55985b);box-shadow:inset 0 0 0 2px #0004}.select select{flex:1;background:transparent;border:0;outline:0;color:white;font-weight:700;font-size:15px;appearance:none}.select select option{color:#111}.play{width:280px;margin:auto;height:58px;border:2px solid #168344;border-radius:8px;color:white;background:linear-gradient(#1bd66d,#0aa04e);font-size:24px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 18px #063d1d99;transition:.2s}.play:hover{transform:translateY(-2px);filter:brightness(1.1)}.credit{position:absolute;right:28px;bottom:10px;color:#e7e7e7;font-size:12px;font-weight:600}
    @media(max-width:800px){.app{display:block;background:linear-gradient(#0e1115aa,#0e1115aa),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=85') center/cover fixed}aside{width:100%;padding:10px 12px}.discord{border:0;padding:4px 8px 10px}.side-nav{display:flex;overflow:auto}.side-nav a{min-width:150px}.bottom{display:none}.topbar{height:auto;min-height:62px;padding:14px 18px}.site-title{position:static;font-size:11px}.topbar nav{display:none}.hero{min-height:calc(100vh - 120px)}.logo{margin-top:-120px;font-size:clamp(22px,8vw,50px)}.controls{left:16px;right:16px;bottom:18px;display:grid;gap:10px}.select,.play{width:100%;max-width:none}.credit{display:none}}
  </style>
</head>
