<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mineaglercraft Web Edition" />
  <title>Mineaglercraft | Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{--green:#19c967;--green-dark:#099849;--text:#f5f7fa;--muted:#aeb5bf;--side:245px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#101419}body{overflow-x:hidden}
    .app{min-height:100vh;display:flex;background:linear-gradient(90deg,rgba(10,12,15,.96) 0 var(--side),transparent var(--side)),linear-gradient(180deg,rgba(22,29,37,.2),rgba(7,11,14,.72)),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=85') center/cover fixed}
    aside{width:var(--side);flex:none;padding:16px 14px 18px;background:rgba(14,16,19,.9);display:flex;flex-direction:column;z-index:2}.discord{display:flex;align-items:center;gap:12px;padding:3px 8px 20px;border-bottom:1px solid #ffffff12;color:#fff;font-weight:700;font-size:13px}.discord-mark{width:35px;height:35px;border-radius:50%;background:#fff;position:relative}.discord-mark:after{content:'●  ●';position:absolute;left:7px;top:9px;color:#25282d;font-size:9px;letter-spacing:3px}.side-nav{display:grid;gap:8px;margin-top:24px}.side-nav a,.bottom a{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;text-decoration:none;color:#e6e9ed;font-size:11px;font-weight:700;text-transform:uppercase;transition:.2s}.side-nav a:hover,.bottom a:hover{background:#ffffff0d}.side-nav a.active{background:#ffffff0b;border-left:3px solid var(--green);padding-left:5px}.block{width:27px;height:27px;border-radius:5px;background:linear-gradient(135deg,#63d9d1,#4d9bd5);box-shadow:inset 0 0 0 2px #0004}.side-nav a:nth-child(2) .block{background:linear-gradient(135deg,#d9d39d,#818b9b)}.side-nav a:nth-child(3) .block{background:linear-gradient(135deg,#ffb17b,#c8473e)}.side-nav a:nth-child(4) .block{background:linear-gradient(135deg,#9adf8f,#5a9b5c)}.side-nav span span{display:block;color:#a9afb7;font-size:10px;margin-top:3px;text-transform:none}.bottom{margin-top:auto;border-top:1px solid #ffffff12;padding-top:12px;display:grid;gap:4px}.version{font-size:11px;color:#7d858f;padding:5px 8px}.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}.topbar{height:74px;display:flex;align-items:center;justify-content:center;gap:45px;padding:0 28px;background:#1013169c}.site-title{position:absolute;left:28px;font-size:13px;font-weight:900;letter-spacing:.04em}.topbar nav{display:flex;gap:28px}.topbar nav a{color:#cbd0d6;text-decoration:none;font-size:12px}.topbar nav a:first-child,.topbar nav a:hover{color:#fff;font-weight:700}.hero{flex:1;min-height:calc(100vh - 74px);display:flex;align-items:center;justify-content:center;position:relative}.logo{text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(25px,5vw,66px);line-height:1.15;letter-spacing:-.08em;color:#e7ebed;text-shadow:-5px 5px #64707c,-9px 9px #111,0 14px 18px #0009;transform:skew(-4deg);margin-top:-100px}.logo small{display:block;margin-top:15px;font-size:clamp(10px,1.4vw,19px);letter-spacing:.15em;text-shadow:2px 2px #222}.controls{position:absolute;left:28px;right:28px;bottom:28px;display:flex;align-items:center;gap:40px}.select{height:60px;min-width:280px;max-width:360px;flex:1;display:flex;align-items:center;gap:12px;padding:0 18px;border:1px solid #ffffff2b;border-radius:10px;background:#101316b8;box-shadow:0 8px 20px #0005}.cube{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,#b9edaa,#55985b);box-shadow:inset 0 0 0 2px #0004}.select select{flex:1;background:transparent;border:0;outline:0;color:white;font-weight:700;font-size:15px;appearance:none}.select select option{color:#111}.play{width:280px;margin:auto;height:58px;border:2px solid #168344;border-radius:8px;color:white;background:linear-gradient(#1bd66d,#0aa04e);font-size:24px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 18px #063d1d99;transition:.2s}.play:hover{transform:translateY(-2px);filter:brightness(1.1)}.credit{position:absolute;right:28px;bottom:10px;color:#e7e7e7;font-size:12px;font-weight:600}
    @media(max-width:800px){.app{display:block;background:linear-gradient(#0e1115aa,#0e1115aa),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=85') center/cover fixed}aside{width:100%;padding:10px 12px}.discord{border:0;padding:4px 8px 10px}.side-nav{display:flex;overflow:auto;margin-top:4px}.side-nav a{min-width:150px}.bottom{display:none}.topbar{height:auto;min-height:62px;padding:14px 18px}.site-title{position:static;font-size:11px}.topbar nav{display:none}.hero{min-height:calc(100vh - 120px)}.logo{margin-top:-120px;font-size:clamp(22px,8vw,50px)}.controls{left:16px;right:16px;bottom:18px;display:grid;gap:10px}.select,.play{width:100%;max-width:none}.credit{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="discord"><div class="discord-mark"></div><span>Discord</span></div>
      <nav class="side-nav" aria-label="Phiên bản">
        <a class="active" href="#play"><i class="block"></i><span>MINEAGLERCRAFT<span>Web Edition</span></span></a>
        <a href="#"><i class="block"></i><span>MINEAGLERCRAFT<span>Modded Editions</span></span></a>
        <a href="#"><i class="block"></i><span>MINEAGLERCRAFT<span>Server List</span></span></a>
        <a href="#"><i class="block"></i><span>MINEAGLERCRAFT<span>Mobile/Controller</span></span></a>
      </nav>

    </aside>
    <main class="main">
      <header class="topbar"><div class="site-title">MINEAGLERCRAFT WEB EDITION</div><nav><a href="#play">Play</a><a href="#">FAQ</a><a href="#">Installations</a><a href="#">Skins</a><a href="#">Patch Notes</a></nav></header>
      <section class="hero" id="play"><div class="logo">MINEAGLERCRAFT<small>WEB EDITION</small></div><div class="controls"><label class="select"><i class="cube"></i><select aria-label="Chọn phiên bản"><option>Latest release</option><option>1.12.2-u2</option><option>1.20.4</option></select><b>⌄</b></label><button class="play" id="playButton">PLAY</button></div><div class="credit">Mineaglercraft Web Edition</div></section>
    </main>
  </div>

</body>
</html>
