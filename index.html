<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineaglercraft | Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --green:#0aa04e; --dark:#101316; --panel:#111820; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; color:#fff; font-family:Inter,system-ui,sans-serif; background:#171717; }
    body { min-height:100vh; background:linear-gradient(#101316aa,#101316dd),url('background.svg') center/cover fixed; }
    .app { min-height:100vh; display:flex; }
    aside { width:215px; flex:none; padding:14px 0 8px; background:#181818e8; display:flex; flex-direction:column; }
    .discord { display:flex; align-items:center; gap:13px; padding:6px 20px 23px; font-size:12px; }
    .discord-mark { width:36px; height:27px; background:#fff; border-radius:10px; position:relative; }
    .discord-mark:after { content:'••'; color:#292929; position:absolute; left:10px; top:1px; font-size:17px; letter-spacing:5px; }
    .side-nav { display:grid; gap:14px; }
    .side-nav a { min-height:68px; display:flex; align-items:center; gap:9px; padding:9px 18px; border-left:4px solid transparent; color:#fff; text-decoration:none; font-size:11px; line-height:1.25; }
    .side-nav a.active { background:#ffffff0f; border-left-color:#08a957; }
    .side-nav span span { display:block; font-weight:400; }
    .block { width:30px; height:30px; flex:none; border-radius:3px; background:url('grass-block.svg') center/contain no-repeat; box-shadow:inset 0 0 0 2px #0004; }
    .bottom { margin-top:auto; padding:0 20px 10px; display:grid; gap:20px; }
    .bottom a { color:#fff; text-decoration:none; font-size:11px; }
    .version { color:#aaa; font-size:11px; }
    main { flex:1; min-width:0; display:flex; flex-direction:column; }
    .topbar { height:66px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#101316cc; }
    .site-title { font-size:13px; font-weight:900; }
    .topbar nav { display:flex; gap:28px; }
    .topbar nav a { color:#cbd0d6; text-decoration:none; font-size:12px; }
    .topbar nav a:first-child { color:#fff; font-weight:700; }
    .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; text-align:center; padding:40px 20px 80px; }
    .logo { font-family:'Press Start 2P',monospace; font-size:clamp(25px,5vw,66px); line-height:1.15; color:#e7ebed; text-shadow:-5px 5px #64707c,-9px 9px #111,0 14px 18px #000; transform:skew(-4deg); }
    .logo small { display:block; margin-top:15px; font-family:Inter,sans-serif; font-size:clamp(10px,1.4vw,19px); letter-spacing:.15em; }
    .controls { width:min(360px,100%); margin-top:48px; display:grid; gap:12px; }
    .select { height:60px; display:flex; align-items:center; gap:12px; padding:0 18px; border:1px solid #ffffff2b; border-radius:10px; background:#101316dd; }
    .select select { flex:1; appearance:none; border:0; outline:0; background:transparent; color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
    .select option { color:#111; }
    .chevron { font-size:20px; font-weight:800; }
    .play { width:100%; height:58px; border:2px solid #168344; border-radius:8px; color:#fff; background:linear-gradient(#1bd66d,#0aa04e); font-size:24px; font-weight:900; letter-spacing:.12em; cursor:pointer; box-shadow:0 4px 0 #075f2e; }
    .play:hover { filter:brightness(1.1); }
    .credit { position:absolute; right:28px; bottom:10px; font-size:12px; font-weight:600; }
    @media (max-width:800px) { .app { display:block; } aside { width:100%; padding:8px 12px; } .discord { padding:4px 8px 10px; } .side-nav { display:flex; overflow:auto; gap:4px; } .side-nav a { min-width:150px; min-height:48px; padding:6px 9px; } .bottom { display:none; } .topbar { height:auto; padding:14px 18px; } .topbar nav { display:none; } .hero { min-height:calc(100vh - 125px); padding-bottom:60px; } .logo { margin-top:-30px; } .credit { display:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="discord"><div class="discord-mark"></div><span>Discord</span></div>
      <nav class="side-nav" aria-label="Launcher navigation">
        <a class="active" href="#play"><i class="block"></i><span><b>EAGLERCRAFT :</b><span>Web Edition</span></span></a>
        <a href="#"><i class="block"></i><span><b>EAGLERCRAFT :</b><span>Modded Editions</span></span></a>
        <a href="#"><i class="block"></i><span><b>EAGLERCRAFT :</b><span>Server List</span></span></a>
        <a href="#"><i class="block"></i><span><b>EAGLERCRAFT :</b><span>Mobile/Controller</span></span></a>
      </nav>
      <div class="bottom"><a href="#">Credits</a><a href="#">Settings</a><div class="version">v1.0.3</div></div>
    </aside>
    <main>
      <header class="topbar"><div class="site-title">MINEAGLERCRAFT WEB EDITION</div><nav><a href="#play">Play</a><a href="#">FAQ</a><a href="#">Installations</a><a href="#">Skins</a><a href="#">Patch Notes</a></nav></header>
      <section class="hero" id="play">
        <div class="logo">MINEAGLERCRAFT<small>WEB EDITION</small></div>
        <div class="controls">
          <label class="select"><i class="block"></i><select aria-label="Game version"><option selected>1.8.8</option></select><span class="chevron">⌄</span></label>
          <button class="play" type="button" onclick="window.location.href='https://eaglercraft.com/play?version=1.8.8-wasm'">PLAY</button>
        </div>
        <div class="credit">Mineaglercraft Web Edition</div>
      </section>
    </main>
  </div>
</body>
</html>
